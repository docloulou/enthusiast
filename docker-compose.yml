services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      ECL_DB_HOST: ${ECL_DB_HOST}
      ECL_DB_PORT: ${ECL_DB_PORT}
      POSTGRES_USER: ${ECL_DB_USER}
      POSTGRES_PASSWORD: ${ECL_DB_PASSWORD}
      POSTGRES_DB: ${ECL_DB_NAME}
  redis:
    image: redis:latest
  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
      args:
        - PORT=10001
        - VITE_API_BASE=http://localhost:10000
        - VITE_WS_BASE=ws://localhost:10000
    ports:
      - "10001:10001"
  api:
    build:
      context: server/
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      RUN_MIGRATIONS: "True"
      RUN_WORKER: "False"
      RUN_BEAT: "False"
      ECL_DB_HOST: ${ECL_DB_HOST}
      ECL_DB_PORT: ${ECL_DB_PORT}
      ECL_DB_USER: ${ECL_DB_USER}
      ECL_DB_PASSWORD: ${ECL_DB_PASSWORD}
      ECL_DB_NAME: ${ECL_DB_NAME}
    
      ECL_DJANGO_ALLOWED_HOSTS: ${ECL_DJANGO_ALLOWED_HOSTS}
      ECL_DJANGO_CORS_ALLOWED_ORIGINS: ${ECL_DJANGO_CORS_ALLOWED_ORIGINS}
      ECL_DJANGO_SECRET_KEY: ${ECL_DJANGO_SECRET_KEY}
      ECL_DJANGO_DEBUG: ${ECL_DJANGO_DEBUG}
    
      ECL_CELERY_BROKER_URL: ${ECL_CELERY_BROKER_URL}
      ECL_CELERY_RESULT_BACKEND: ${ECL_CELERY_RESULT_BACKEND}
      ECL_CELERY_TIMEZONE: ${ECL_CELERY_TIMEZONE}
    
      ECL_ADMIN_EMAIL: ${ECL_ADMIN_EMAIL}
      ECL_ADMIN_PASSWORD: ${ECL_ADMIN_PASSWORD}
    
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
  worker:
    build:
      context: server/
      dockerfile: Dockerfile
    environment:
      RUN_MIGRATIONS: "False"
      RUN_WORKER: "True"
      RUN_BEAT: "False"
      ECL_DB_HOST: ${ECL_DB_HOST}
      ECL_DB_PORT: ${ECL_DB_PORT}
      ECL_DB_USER: ${ECL_DB_USER}
      ECL_DB_PASSWORD: ${ECL_DB_PASSWORD}
      ECL_DB_NAME: ${ECL_DB_NAME}
    
      ECL_DJANGO_ALLOWED_HOSTS: ${ECL_DJANGO_ALLOWED_HOSTS}
      ECL_DJANGO_CORS_ALLOWED_ORIGINS: ${ECL_DJANGO_CORS_ALLOWED_ORIGINS}
      ECL_DJANGO_SECRET_KEY: ${ECL_DJANGO_SECRET_KEY}
      ECL_DJANGO_DEBUG: ${ECL_DJANGO_DEBUG}
    
      ECL_CELERY_BROKER_URL: ${ECL_CELERY_BROKER_URL}
      ECL_CELERY_RESULT_BACKEND: ${ECL_CELERY_RESULT_BACKEND}
      ECL_CELERY_TIMEZONE: ${ECL_CELERY_TIMEZONE}
    
      ECL_ADMIN_EMAIL: ${ECL_ADMIN_EMAIL}
      ECL_ADMIN_PASSWORD: ${ECL_ADMIN_PASSWORD}
    
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

  beat:
    build:
      context: server/
      dockerfile: Dockerfile
    environment:
      - RUN_MIGRATIONS=False
      - RUN_WORKER=False
      - RUN_BEAT=True
    depends_on:
      - redis
      - postgres
